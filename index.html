<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>2026년 정책기준 안내</title>
<style>
  :root { --accent: #0b2f6b; --dark: #1f2937; --muted: #6b7280; --bg: #f6f8fb; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--dark); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .container { background: white; border: 1px solid #e5e7eb; border-radius: 18px; padding: 40px; box-shadow: 0 10px 28px rgba(0,0,0,.06); max-width: 600px; width: 100%; text-align: center; }
  h1 { font-size: 26px; margin-top: 0; margin-bottom: 5px; color: var(--accent); letter-spacing: -0.5px;}
  p { color: var(--muted); margin-bottom: 30px; font-size: 15px; letter-spacing: -0.3px;}
  h2 { font-size: 18px; color: var(--dark); margin: 25px 0 15px; text-align: left; padding-bottom: 8px; border-bottom: 2px solid #eef2ff; letter-spacing: -0.5px;}
  .links { display: flex; flex-direction: column; gap: 12px; }
  .links a { display: block; padding: 14px 20px; background: #eef2ff; color: #0b2f6b; text-decoration: none; border-radius: 12px; font-weight: 700; font-size: 15px; transition: all 0.2s ease; border: 1px solid #c7d2fe; text-align: left; position: relative; letter-spacing: -0.3px; padding-right: 44px;}
  .links a::after { content: '→'; position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: #0b2f6b; opacity: 0.5; transition: all 0.2s ease; }
  .links a:hover { background: #0b2f6b; color: white; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(11, 47, 107, 0.2); }
  .links a:hover::after { color: white; opacity: 1; right: 15px; }
  .links a.best { background: #2563eb; color: white; border-color: #1e4ed8; }
  .links a.best::after { color: white; }
  .links .pending { display:block;padding:14px 20px;background:#f3f4f6;color:#6b7280;border-radius:12px;font-weight:700;font-size:15px;border:1px dashed #d1d5db;text-align:left }
  .badge { display: inline-block; background: #0b2f6b; color: white; font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-left: 8px; vertical-align: middle; font-weight: normal;}
  .badge.red { background:#dc2626 } .badge.gray { background:#9ca3af } .badge.white { background:#fff; color:#2563eb }
  .box { background: white; border: 1px solid #e5e7eb; border-radius: 18px; padding: 36px 28px; box-shadow: 0 10px 28px rgba(0,0,0,.06); max-width: 400px; width: 100%; text-align: center; }
  .box h1 { font-size: 22px; margin-bottom: 10px; } .box p { margin-bottom: 18px; font-size: 14px; }
  .box input[type=password] { padding: 12px; border: 1px solid #c7d2fe; border-radius: 8px; width: 100%; font-size: 16px; outline: none; font-family: inherit;}
  .box input[type=password]:focus { border-color: #0b2f6b; }
  .box label { display:block; text-align:left; font-size:12px; color:#6b7280; margin:10px 0 14px; cursor:pointer }
  .box button { padding: 12px; background: #0b2f6b; color: white; border: none; border-radius: 8px; width: 100%; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;}
  .box button:disabled { opacity:.6; cursor:wait }
  #err { color: #dc2626; font-size: 13px; min-height: 18px; margin: 8px 0 0; }
  .tools { margin:-20px 0 20px; font-size:12px; color:#6b7280 }
  .tools a { color:#6b7280; margin:0 6px }
  .foot { position: fixed; bottom: 15px; right: 15px; font-size: 11px; color: rgba(107, 114, 128, 0.6); pointer-events: none; -webkit-user-select: none; user-select: none; letter-spacing: -0.2px; z-index: 9999; }
</style>
</head>
<body>
<!--
  목차는 암호화된 menu.enc.json에서 읽어 그린다(이 페이지 자체에는 문서 정보가 없음).
  문서 추가·목차 수정은 admin.html(관리자 업로드)에서 한다.
-->
<div class="box" id="login" style="display:none">
  <h1>🔒 보안 로그인</h1>
  <p>문서를 열람하려면 비밀번호를 입력하세요.</p>
  <form id="f"><input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" autofocus>
  <label><input type="checkbox" id="keep"> 이 기기에서 비밀번호 기억</label>
  <button id="btn">로그인</button></form>
  <div id="err"></div>
</div>
<div class="container" id="main" style="display:none">
  <h1 id="ttl">2026년 정책기준 안내</h1>
  <p>열람하실 문서를 선택해 주세요.</p>
  <div class="tools"><a href="#" id="logout">🔒 로그아웃</a>·<a href="admin.html">⚙ 관리자 업로드</a></div>
  <div id="menu"></div>
</div>
<div class="foot">Copyright © 2026.05 Seeun Papa. All rights reserved. 본 저작물의 무단 전재 및 재배포를 엄격히 금지합니다.</div>
<script>
(function(){
  function b(s){var r=atob(s),n=r.length,u=new Uint8Array(n);for(var i=0;i<n;i++)u[i]=r.charCodeAt(i);return u;}
  function get(k){try{return sessionStorage.getItem(k)||localStorage.getItem(k);}catch(e){return null;}}
  async function dec(E,pw){
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(E.salt),iterations:E.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(E.iv)},key,b(E.ct)));
  }
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function badge(t,it){
    var cls=t==='NEW'||t==='최근 업데이트'?'red':(it&&it.style==='best'?'white':'');
    return '<span class="badge '+cls+'">'+esc(t)+'</span>';
  }
  function render(M){
    document.getElementById('ttl').textContent=M.title||'정책기준 안내';
    document.getElementById('menu').innerHTML=(M.sections||[]).map(function(s){
      return '<h2>'+esc(s.title)+(s.badge?' '+badge(s.badge):'')+'</h2><div class="links">'+(s.items||[]).map(function(it){
        var bs=(it.badges||[]).map(function(x){return badge(x,it);}).join(' ');
        if(it.pending||!it.href) return '<div class="pending">'+esc(it.title)+' <span class="badge gray">준비 중</span></div>';
        return '<a href="'+esc(encodeURI(it.href))+'"'+(it.style==='best'?' class="best"':'')+'>'+esc(it.title)+' '+bs+'</a>';
      }).join('')+'</div>';
    }).join('');
    document.getElementById('login').style.display='none';
    document.getElementById('main').style.display='';
  }
  var enc=fetch('menu.enc.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('목차 파일을 불러오지 못했습니다');return r.json();});
  function tryOpen(pw){return enc.then(function(E){return dec(E,pw);}).then(function(t){return JSON.parse(t);});}
  var saved=get('pp_pw');
  (saved?tryOpen(saved):Promise.reject()).then(render).catch(function(){
    document.getElementById('login').style.display='';
    var f=document.getElementById('f'),btn=document.getElementById('btn'),err=document.getElementById('err');
    f.onsubmit=function(ev){ev.preventDefault();var pw=document.getElementById('pw').value;if(!pw)return;
      btn.disabled=true;btn.textContent='확인 중…';err.textContent='';
      tryOpen(pw).then(function(M){
        try{sessionStorage.setItem('pp_pw',pw);if(document.getElementById('keep').checked)localStorage.setItem('pp_pw',pw);}catch(e){}
        render(M);
      }).catch(function(e){err.textContent=/불러오지/.test(e&&e.message)?e.message:'비밀번호가 일치하지 않습니다.';btn.disabled=false;btn.textContent='로그인';});
    };
  });
  document.getElementById('logout').onclick=function(ev){ev.preventDefault();try{sessionStorage.removeItem('pp_pw');localStorage.removeItem('pp_pw');}catch(e){}location.reload();};
})();
</script>
</body>
</html>
